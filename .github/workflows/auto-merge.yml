name: Auto Merge Trusted User

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'scientistPargain'
    runs-on: ubuntu-latest

    permissions:
      pull-requests: write
      contents: write

    steps:
      - name: Merge trusted user's PR
        run: |
          gh pr merge ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --squash \
            --admin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
